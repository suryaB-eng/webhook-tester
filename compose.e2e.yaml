# Use with an explicit disposable project:
# docker compose -p webhook-tester-e2e -f compose.yaml -f compose.e2e.yaml up --build -d --wait
services:
  postgres:
    environment:
      POSTGRES_PASSWORD: superuser_local_only
      POSTGRES_DB: webhook_tester_e2e_admin
    ports: !override
      - "127.0.0.1:55434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d webhook_tester_e2e_admin && psql -U postgres -d webhook_tester_e2e_admin -c 'SELECT 1' && psql -U postgres -d webhook_tester -c 'SELECT 1' && psql -U postgres -d demo_target -c 'SELECT 1'"]

  migrate:
    environment:
      ADMIN_DATABASE_URL: postgresql://postgres:superuser_local_only@postgres:5432/webhook_tester_e2e_admin

  api:
    environment:
      LOCAL_ORIGIN: http://127.0.0.1:14173
    ports: !override
      - "127.0.0.1:14000:4000"

  demo-target:
    ports: !override
      - "127.0.0.1:14010:4010"

  web:
    ports: !override
      - "127.0.0.1:14173:4173"
