name: webhook-tester-tests

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: superuser_local_only
      POSTGRES_DB: webhook_tester_test_admin
    ports:
      - "127.0.0.1:55433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d webhook_tester_test_admin && psql -U postgres -d demo_target -c 'SELECT 1'"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s
