name: webhook-tester

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-superuser_local_only}
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres && psql -U postgres -d webhook_tester -c 'SELECT 1' && psql -U postgres -d demo_target -c 'SELECT 1'"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 10s

  api:
    build: .
    environment:
      API_HOST: 0.0.0.0
      API_PORT: 4000
    ports:
      - "127.0.0.1:4000:4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health').then(async r=>{if(!r.ok||(await r.json()).status!=='ok')process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

  web:
    build: .
    command: ["npm", "run", "preview", "-w", "@webhook-tester/web", "--", "--host", "0.0.0.0"]
    environment:
      API_PROXY_TARGET: http://api:4000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:4173:4173"
    healthcheck:
      test: ["CMD", "node", "-e", "Promise.all([fetch('http://127.0.0.1:4173/'),fetch('http://127.0.0.1:4173/api/health')]).then(async ([w,a])=>{if(!w.ok||!a.ok||(await a.json()).status!=='ok')process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 5s

volumes:
  postgres_data:
